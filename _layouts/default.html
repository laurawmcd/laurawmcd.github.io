<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  {% seo %}
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <a href="https://laurawmcd.github.io/betterbox">Betterbox</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <a href="{{ site.linkedin }}">LinkedIn</a>
    </nav>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer class="site-footer">
    <p><a href="{{ '/contact/' | relative_url }}">Get in touch.</a></p>
    <p>Headshots by <a href="https://www.marygardella.com/">Mary Gardella</a>.</p>
  </footer>
</body>
</html>
